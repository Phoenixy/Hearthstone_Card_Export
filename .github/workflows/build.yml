# A Hearthstone Hungary alkalmazás fordítása és kiadása a GitHubon.
#
# - Minden pushnál és pull requestnél lefordítja az alkalmazást, és elkészíti a telepítőt
#   (HearthstoneHungary-Setup.exe) és a ZIP csomagot is. Mindkettő letölthető a futás oldalán,
#   az "Artifacts" résznél (teszteléshez, Visual Studio nélkül).
# - Ha a master ágra olyan verzió kerül (src/HearthstoneHungary/Properties/AssemblyInfo.cs), amihez még nincs
#   Release, akkor létrehozza a v<verzió> Release-t a CHANGELOG.md bejegyzésével, a telepítővel
#   (HearthstoneHungary-Setup.exe) és a HearthstoneHungary.zip-pel (utóbbit használja az automatikus frissítés).

name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Verzió és CHANGELOG bejegyzés
        id: version
        run: |
          $assemblyInfo = Get-Content "src\HearthstoneHungary\Properties\AssemblyInfo.cs" -Raw -Encoding UTF8
          if ($assemblyInfo -notmatch 'AssemblyVersion\("(\d+)\.(\d+)\.(\d+)') {
              throw "Nem találom az AssemblyVersion-t az AssemblyInfo.cs-ben."
          }
          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $tag = "v$version"
          Write-Host "Verzió: $tag"

          $changelog = Get-Content "CHANGELOG.md" -Encoding UTF8
          $start = ($changelog | Select-String -Pattern "^v$([regex]::Escape($version))\b" | Select-Object -First 1).LineNumber
          if (-not $start) {
              throw "A CHANGELOG.md-ben nincs '$tag' kezdetű bejegyzés."
          }
          $notes = @()
          for ($i = $start; $i -lt $changelog.Count; $i++) {
              if ($changelog[$i] -match '^v\d+\.\d+') { break }
              $notes += $changelog[$i]
          }
          ($notes -join "`n").Trim() | Set-Content "release-notes.md" -Encoding UTF8

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host "A $tag Release már létezik, csak fordítás lesz." }

      - name: Fordítás
        run: |
          dotnet build "src\HearthstoneHungary\HearthstoneHungary.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { throw "A fordítás nem sikerült." }
          if (-not (Test-Path "dist\HearthstoneHungary.zip")) { throw "Nem készült el a dist\HearthstoneHungary.zip." }
          Write-Host "A csomag tartalma:"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist\HearthstoneHungary.zip")).Entries | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bájt)" }

      - name: Telepítő (Setup.exe) készítése
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
              Write-Host "Inno Setup telepítése..."
              choco install innosetup -y --no-progress
              $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "Nem található az Inno Setup (ISCC.exe)." }

          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "installer\HearthstoneHungary.iss"
          if ($LASTEXITCODE -ne 0) { throw "A telepítő készítése nem sikerült." }
          if (-not (Test-Path "dist\HearthstoneHungary-Setup.exe")) { throw "Nem készült el a dist\HearthstoneHungary-Setup.exe." }
          $size = (Get-Item "dist\HearthstoneHungary-Setup.exe").Length
          Write-Host "Telepítő kész: dist\HearthstoneHungary-Setup.exe ($size bájt)"

      - name: Alkalmazás csomagok feltöltése (Artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: HearthstoneHungary-${{ steps.version.outputs.tag }}
          path: |
            dist/HearthstoneHungary-Setup.exe
            dist/HearthstoneHungary.zip

      - name: GitHub Release létrehozása
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.version.outputs.exists == 'false'
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release create $tag "dist\HearthstoneHungary-Setup.exe" "dist\HearthstoneHungary.zip" --repo $env:GITHUB_REPOSITORY --title $tag --notes-file release-notes.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "A GitHub Release létrehozása nem sikerült." }
          Write-Host "Kész: $tag kiadva (Setup.exe + ZIP). A felhasználóknál az alkalmazás 6 órán belül frissül."
